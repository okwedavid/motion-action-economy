name: API CI

on:
  push:
    branches: [main, develop]
    paths: ['apps/api/**', '.github/workflows/api-ci.yml']
  pull_request:
    paths: ['apps/api/**', '.github/workflows/api-ci.yml']

jobs:
  test:
    name: Lint, Typecheck, Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests (pg-mem, no external DB)
        run: npm test
        env:
          NODE_ENV: test
          SESSION_SECRET: ci-test-session-secret
